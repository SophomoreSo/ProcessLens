{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ t('nav.alerts') }}</h1>
    <p>{{ t('al.intro') }}</p>
  </div>
  <div class="actions">
    <button type="button" class="btn" id="new-alert-rule">{{ t('al.new_rule') }}</button>
    <button type="button" class="btn btn-primary" id="evaluate-now">{{ t('al.evaluate_now') }}</button>
  </div>
</div>
<p class="notice info"><b>{{ t('al.no_monitoring') }}</b> {{ t('al.no_monitoring_detail') }}</p>
<div id="eval-result"></div>
<section class="card hidden" id="alert-rule-editor"></section>
<section class="card"><h2>{{ t('al.rules') }}</h2><div id="alert-rules"><div class="state"><span class="spinner"></span> {{ t('common.loading') }}</div></div></section>
<section class="card">
  <div class="card-head"><h2>{{ t('nav.alerts') }}</h2>
    <div class="actions">
      <label class="inline">{{ t('common.status') }} <select id="status-filter"><option value="open">{{ t('alert.status.open') }}</option><option value="acknowledged">{{ t('alert.status.acknowledged') }}</option>
        <option value="resolved">{{ t('alert.status.resolved') }}</option><option value="">{{ t('common.all') }}</option></select></label>
      <label class="inline"><input type="checkbox" id="active-only"> {{ t('al.active_only') }}</label>
      <a class="btn btn-sm" id="alerts-export" download>{{ t('export.csv') }}</a>
    </div></div>
  <div id="alerts-root"></div>
</section>
{% endblock %}
{% block scripts %}
<script type="module" src="{{ url_for('static', path='js/alerts.js') }}"></script>
{% endblock %}
