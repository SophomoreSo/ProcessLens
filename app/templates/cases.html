{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ t('nav.cases') }}</h1>
    <p>{{ t('cs.intro') }}</p>
  </div>
  <div id="case-exports"></div>
</div>
<div class="split">
  <section class="card"><div id="cases-root"><div class="state"><span class="spinner"></span> {{ t('common.loading') }}</div></div></section>
  <section class="card" aria-live="polite"><div id="case-detail"><div class="state">{{ t('cs.select_hint') }}</div></div></section>
</div>
{% endblock %}
{% block scripts %}
<script type="module" src="{{ url_for('static', path='js/cases.js') }}"></script>
{% endblock %}
